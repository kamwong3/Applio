services:
  applio:
    build: .
    image: applio
    shm_size: 8g
    network_mode: "host"
    working_dir: /app
    command: python3 app.py
    volumes:
      - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
